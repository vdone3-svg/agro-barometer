name: 🌾 AGRO BAROMETER — Daily Update

on:
  schedule:
    # GitHub запускає cron «за можливості»: на :00 запуски запізнюються на години або губляться
    # (05–06.11 — +7,8 год, 08.11 — не відбувся). Тому кілька спроб на «тихих» хвилинах;
    # перша, що спрацює, будує барометр, решта пропускаються (job guard). Час Київ, зима UTC+2.
    - cron: '13 4 * * *'   # 06:13
    - cron: '41 4 * * *'   # 06:41
    - cron: '17 5 * * *'   # 07:17
    - cron: '47 5 * * *'   # 07:47
    - cron: '23 7 * * *'   # 09:23
    - cron: '53 9 * * *'   # 11:53
    - cron: '29 12 * * *'  # 14:29 — останній шанс
  workflow_dispatch:

concurrency:
  group: barometer-deploy
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.chk.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: prices_history.json
      - id: chk
        run: |
          TODAY=$(TZ=Europe/Kyiv date +%d.%m.%Y)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> $GITHUB_OUTPUT; exit 0; fi
          if grep -q "\"date\": *\"$TODAY\"" prices_history.json 2>/dev/null; then
            echo "⏭ барометр за $TODAY уже зібрано — пропускаю"; echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "▶ за $TODAY ще не зібрано — запускаю"; echo "run=true" >> $GITHUB_OUTPUT
          fi

  update:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Official NBU rate (bank.gov.ua)
        run: |
          python3 - <<'PY' || echo "⚠️ НБУ недоступний — буде курс із секрету"
          import json, os, urllib.request
          def get(code):
              u = f"https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode={code}&json"
              return json.load(urllib.request.urlopen(u, timeout=20))[0]
          usd, eur = get("USD"), get("EUR")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"NBU_USD_UAH={usd['rate']}\nNBU_EUR_UAH={eur['rate']}\nNBU_DATE={usd['exchangedate']}\n")
          print("✅ НБУ", usd["exchangedate"], "USD", usd["rate"], "EUR", eur["rate"])
          PY

      - name: Telegram prices (Telethon + Playwright fallback)
        env:
          USD_UAH_RATE: ${{ secrets.USD_UAH_RATE }}
          TG_SESSION:   ${{ secrets.TG_SESSION }}
          TG_API_ID:    ${{ secrets.TG_API_ID }}
          TG_API_HASH:  ${{ secrets.TG_API_HASH }}
        run: |
          python3 tg_web_parser.py || echo "⚠️ tg_web_parser failed — продовжуємо без Telegram"
          COUNT=$(python3 -c "import json; d=json.load(open('telegram_prices.json')); print(d.get('records_total', len(d.get('records',[]))))" 2>/dev/null || echo "?")
          echo "✅ Telegram: $COUNT записів"

      - name: Land market
        env:
          TG_SESSION:   ${{ secrets.TG_SESSION }}
          TG_API_ID:    ${{ secrets.TG_API_ID }}
          TG_API_HASH:  ${{ secrets.TG_API_HASH }}
        run: |
          python3 land_parser.py || echo "⚠️ land_parser failed"
          COUNT=$(python3 -c "import json; print(json.load(open('land_data.json')).get('records_total','?'))" 2>/dev/null || echo "?")
          echo "✅ Land: $COUNT лотів"

      - name: Web prices — Nibulon + e-zerno
        env:
          USD_UAH_RATE: ${{ secrets.USD_UAH_RATE }}
        run: python3 fetch_web_prices.py || echo "⚠️ web prices failed — продовжуємо без web"

      - name: News parser (latifundist, agroportal, apk-inform, ukragroconsult)
        run: |
          python3 news_parser.py || echo "⚠️ news_parser failed — продовжуємо без новин"
          COUNT=$(python3 -c "import json; d=json.load(open('news_data.json')); print(d.get('total',0))" 2>/dev/null || echo "?")
          echo "✅ News: $COUNT статей"

      - name: Build HTML (+ висновки через Gemini, безкоштовний рівень)
        env:
          USD_UAH_RATE: ${{ secrets.USD_UAH_RATE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 build_barometer.py
          SIZE=$(wc -c < index.html | xargs)
          echo "✅ index.html: $SIZE байт"

      - name: Commit price history to main
        run: |
          git config user.email "noreply@github.com"
          git config user.name "github-actions[bot]"
          if [ -f prices_history.json ]; then
            git add prices_history.json
            git diff --cached --quiet || git commit -m "chore: update prices_history.json $(date -u +'%Y-%m-%d') [skip ci]"
            git push origin main
            echo "✅ prices_history.json збережено в main"
          else
            echo "⚠️ prices_history.json не знайдено — пропускаємо"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        run: |
          git config user.email "noreply@github.com"
          git config user.name "github-actions[bot]"
          # Копіюємо index.html перед зміною гілки
          cp index.html /tmp/index.html
          # Прибираємо незакомічені зміни — index.html вже скопійовано в /tmp
          git checkout -- . 2>/dev/null || true
          # Перемикаємось на gh-pages (або створюємо порожню сирітську гілку)
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git reset --hard origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/index.html index.html
          touch .nojekyll
          git add index.html .nojekyll
          git commit -m "deploy: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload data snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: |
            telegram_prices.json
            telegram_news.json
            land_data.json
            web_prices.json
            news_data.json
            index.html
          retention-days: 7
