name: 🌾 AGRO BAROMETER — Daily Update

on:
  schedule:
    # 07:00 Kyiv зима (UTC+2) = 05:00 UTC
    # Влітку змінити на '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: barometer-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Official NBU rate (bank.gov.ua)
        run: |
          python3 - <<'PY' || echo "⚠️ НБУ недоступний — буде курс із секрету"
          import json, os, urllib.request
          def get(code):
              u = f"https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode={code}&json"
              return json.load(urllib.request.urlopen(u, timeout=20))[0]
          usd, eur = get("USD"), get("EUR")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"NBU_USD_UAH={usd['rate']}\nNBU_EUR_UAH={eur['rate']}\nNBU_DATE={usd['exchangedate']}\n")
          print("✅ НБУ", usd["exchangedate"], "USD", usd["rate"], "EUR", eur["rate"])
          PY

      - name: Telegram prices (Telethon + Playwright fallback)
        env:
          USD_UAH_RATE: ${{ secrets.USD_UAH_RATE }}
          TG_SESSION:   ${{ secrets.TG_SESSION }}
          TG_API_ID:    ${{ secrets.TG_API_ID }}
          TG_API_HASH:  ${{ secrets.TG_API_HASH }}
        run: |
          python3 tg_web_parser.py || echo "⚠️ tg_web_parser failed — продовжуємо без Telegram"
          COUNT=$(python3 -c "import json; d=json.load(open('telegram_prices.json')); print(d.get('records_total', len(d.get('records',[]))))" 2>/dev/null || echo "?")
          echo "✅ Telegram: $COUNT записів"

      - name: Land market
        env:
          TG_SESSION:   ${{ secrets.TG_SESSION }}
          TG_API_ID:    ${{ secrets.TG_API_ID }}
          TG_API_HASH:  ${{ secrets.TG_API_HASH }}
        run: |
          python3 land_parser.py || echo "⚠️ land_parser failed"
          COUNT=$(python3 -c "import json; print(json.load(open('land_data.json')).get('records_total','?'))" 2>/dev/null || echo "?")
          echo "✅ Land: $COUNT лотів"

      - name: Web prices — Nibulon + e-zerno
        env:
          USD_UAH_RATE: ${{ secrets.USD_UAH_RATE }}
        run: python3 fetch_web_prices.py || echo "⚠️ web prices failed — продовжуємо без web"

      - name: News parser (latifundist, agroportal, apk-inform, ukragroconsult)
        run: |
          python3 news_parser.py || echo "⚠️ news_parser failed — продовжуємо без новин"
          COUNT=$(python3 -c "import json; d=json.load(open('news_data.json')); print(d.get('total',0))" 2>/dev/null || echo "?")
          echo "✅ News: $COUNT статей"

      - name: Build HTML
        env:
          USD_UAH_RATE: ${{ secrets.USD_UAH_RATE }}
        run: |
          python3 build_barometer.py
          SIZE=$(wc -c < index.html | xargs)
          echo "✅ index.html: $SIZE байт"

      - name: Deploy to GitHub Pages
        run: |
          git config user.email "noreply@github.com"
          git config user.name "github-actions[bot]"
          # Копіюємо index.html перед зміною гілки
          cp index.html /tmp/index.html
          # Перемикаємось на gh-pages (або створюємо порожню сирітську гілку)
          git fetch origin gh-pages 2>/dev/null || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
            git reset --hard origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/index.html index.html
          git add index.html
          git commit -m "deploy: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload data snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: |
            telegram_prices.json
            telegram_news.json
            land_data.json
            web_prices.json
            news_data.json
            index.html
          retention-days: 7
