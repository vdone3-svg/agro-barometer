name: 🌾 AGRO BAROMETER — Daily Update

on:
  schedule:
    # 07:00 Kyiv зима (UTC+2) = 05:00 UTC
    # Влітку змінити на '0 4 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: barometer-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Official NBU rate (bank.gov.ua)
        run: |
          python3 - <<'PY' || echo "⚠️ НБУ недоступний — буде курс із секрету"
          import json, os, urllib.request
          def get(code):
              u = f"https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?valcode={code}&json"
              return json.load(urllib.request.urlopen(u, timeout=20))[0]
          usd, eur = get("USD"), get("EUR")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"NBU_USD_UAH={usd['rate']}\nNBU_EUR_UAH={eur['rate']}\nNBU_DATE={usd['exchangedate']}\n")
          print("✅ НБУ", usd["exchangedate"], "USD", usd["rate"], "EUR", eur["rate"])
          PY

      - name: Telegram prices (Telethon + Playwright fallback)
        env:
          USD_UAH_RATE: ${{ secrets.USD_UAH_RATE }}
          TG_SESSION:   ${{ secrets.TG_SESSION }}
          TG_API_ID:    ${{ secrets.TG_API_ID }}
          TG_API_HASH:  ${{ secrets.TG_API_HASH }}
        run: |
          python3 tg_web_parser.py || echo "⚠️ tg_web_parser failed — продовжуємо без Telegram"
          COUNT=$(python3 -c "import json; d=json.load(open('telegram_prices.json')); print(d.get('records_total', len(d.get('records',[]))))" 2>/dev/null || echo "?")
          echo "✅ Telegram: $COUNT записів"

      - name: Land market
        env:
          TG_SESSION:   ${{ secrets.TG_SESSION }}
          TG_API_ID:    ${{ secrets.TG_API_ID }}
          TG_API_HASH:  ${{ secrets.TG_API_HASH }}
        run: |
          python3 land_parser.py || echo "⚠️ land_parser failed"
          COUNT=$(python3 -c "import json; print(len(json.load(open('land_data.json'))))" 2>/dev/null || echo "?")
          echo "✅ Land: $COUNT лотів"

      - name: Web prices — Nibulon + e-zerno
        env:
          USD_UAH_RATE: ${{ secrets.USD_UAH_RATE }}
        run: python3 fetch_web_prices.py || echo "⚠️ web prices failed — продовжуємо без web"

      - name: News parser (latifundist, agroportal, apk-inform, ukragroconsult)
        run: |
          python3 news_parser.py || echo "⚠️ news_parser failed — продовжуємо без новин"
          COUNT=$(python3 -c "import json; d=json.load(open('news_data.json')); print(d.get('total',0))" 2>/dev/null || echo "?")
          echo "✅ News: $COUNT статей"

      - name: Build HTML
        env:
          USD_UAH_RATE: ${{ secrets.USD_UAH_RATE }}
        run: |
          python3 build_barometer.py
          SIZE=$(wc -c < index.html | xargs)
          echo "✅ index.html: $SIZE байт"

      - name: Prepare dist
        run: |
          mkdir -p dist
          cp index.html dist/

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy \
            --prod \
            --dir=dist \
            --message "auto: $(date -u +'%Y-%m-%d %H:%M UTC')"

      - name: Dump data to log (manual runs only, for audit)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          tar czf - telegram_prices.json telegram_news.json land_data.json web_prices.json news_data.json 2>/dev/null | base64 -w0 > dump.b64 || true
          echo "===DUMP_BEGIN==="; cat dump.b64; echo; echo "===DUMP_END==="

      - name: Upload data snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_number }}
          path: |
            telegram_prices.json
            telegram_news.json
            land_data.json
            web_prices.json
            news_data.json
            index.html
          retention-days: 7
